<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Field Dispatch</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/satellite.js@5.0.0/dist/satellite.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.20/dist/hls.min.js"></script>
<style>
:root{--base:#EEF2F4;--panel:#FFFFFF;--ink:#16222E;--muted:#5B6B7A;--line:#D5DDE3;--vis:#F2B705;--go:#1F6FEB;--work:#2E8B57;--late:#C93C3C;color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--base);color:var(--ink);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
header{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:10px 14px;background:var(--panel);border-bottom:3px solid var(--vis)}
.cash{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.sub{color:var(--muted);font-size:13px;text-align:right}
#lock{display:none;padding:8px 14px;background:var(--vis);font-weight:600}
#lock button{margin-left:8px}
#map{flex:1 1 50%;min-height:200px}
.sheet{flex:1 1 50%;display:flex;flex-direction:column;background:var(--panel);min-height:0}
nav{display:flex;border-bottom:1px solid var(--line)}
nav button{flex:1;padding:12px 0;border:0;background:none;font:inherit;color:var(--muted);border-bottom:3px solid transparent}
nav button.on{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}
#pane{overflow-y:auto;padding:4px 14px 20px;flex:1}
.row{padding:10px 0;border-bottom:1px solid var(--line)}
.row h3{margin:0 0 2px;font-size:15px}
.meta{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.btn{display:inline-block;margin:6px 6px 0 0;padding:9px 12px;border:1px solid var(--ink);border-radius:6px;background:var(--panel);font:inherit;color:var(--ink)}
.btn.main{background:var(--ink);color:#fff}
.btn:disabled{opacity:.4}
.btn:focus-visible,nav button:focus-visible{outline:3px solid var(--go);outline-offset:2px}
.tag{display:inline-block;padding:1px 8px;border-radius:10px;font-size:12px;margin-right:6px;color:#fff}
.t-idle{background:var(--muted)}.t-enroute,.t-returning{background:var(--go)}.t-onsite{background:var(--work)}.t-late{background:var(--late)}
.empty{color:var(--muted);padding:16px 0}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 14px;border-radius:8px;display:none;z-index:999;max-width:90%}
.pin{font-size:22px;line-height:1;text-shadow:0 0 3px #fff,0 0 3px #fff}
.dim{opacity:.4;filter:grayscale(1)}
video{width:100%;background:#D5DDE3;border-radius:6px;margin-top:8px}
.badge{font-size:13px;font-weight:600;padding:3px 10px;border-radius:12px;white-space:nowrap}
.b-still{background:#D8E6FF;color:#1D4FA8}.b-walk{background:#D5F2DC;color:#1E6B34}.b-maybe{background:#FFF1BF;color:#7A5A00}.b-drive{background:#2E8B57;color:#fff}
.me{width:16px;height:16px;border-radius:50%;background:var(--go);border:3px solid #fff;box-shadow:0 0 0 2px var(--go)}
</style>
</head>
<body>
<header>
  <div class="cash" id="cash">$0</div>
  <div class="badge b-still" id="move">🧍 Still</div>
  <div class="sub" id="status">Finding location</div>
</header>
<div id="lock">Driving. Dispatch is locked.<button class="btn" data-act="passenger">I am a passenger</button></div>
<div id="map"></div>
<div class="sheet">
  <nav>
    <button data-tab="tickets" class="on">Tickets</button>
    <button data-tab="crew">Crew</button>
    <button data-tab="cams">Cameras</button>
    <button data-tab="shop">Shop</button>
  </nav>
  <div id="pane"></div>
</div>
<div id="toast"></div>
<script>
// Game rules. Every price, timer and rate lives here so tuning never touches code.
const CONFIG = {
  timeScale: 1,                 // 1 means real time. Raise it to speed up testing.
  startGrant: 100000,
  roadFactor: 1.35,             // straight line distance times this equals road distance
  returnRadiusM: 200,           // a crew within this distance of you counts as back
  spawnKm: [1.5, 9],            // tickets appear between these distances from you
  jobsPerUnitHour: 0.6,
  baseTickets: 3,
  ticketsPerUnit: 2,
  latePay: 0.5,                 // share of pay earned when the SLA is missed
  dividend: { amount: 20000, cooldownH: 24, minJobs: 3, belowUnits: 3, belowCash: 20000 },
  locationEveryMs: 20000,       // how often to read the phone's cached location
  fixMaxAgeMs: 30000,           // only accept cached fixes younger than this
  driveMph: 25,                 // driving counts only above this speed
  driveConfirmS: 120,           // and only after holding it this many seconds
  fallbackCenter: [36.1716, -115.1391],
  camMaxKm: 25,                 // camera install tickets only use real cameras within this distance
  camBreakPerHour: 0.02,        // chance per installed camera per hour that it breaks
  passMinElevDeg: 30,           // a satellite counts as overhead above this angle
  passSearchH: 3                // how far ahead to look for the next pass
};

// Theme pack. Swap this object to turn the same engine into a different trade.
const THEME = {
  units: {
    device:    { label: "Device repair tech",  icon: "🚗", price: 18000, wage: 28, kmh: 45, tags: ["device"] },
    network:   { label: "Network installer",   icon: "🚐", price: 42000, wage: 38, kmh: 42, tags: ["network", "device"] },
    pos:       { label: "Point of sale tech",  icon: "🚙", price: 38000, wage: 36, kmh: 45, tags: ["pos", "device"] },
    av:        { label: "AV crew",             icon: "🚚", price: 55000, wage: 52, kmh: 40, tags: ["av", "camera"] },
    satellite: { label: "Satellite installer", icon: "🛻", price: 60000, wage: 44, kmh: 42, tags: ["satellite"] }
  },
  jobs: [
    { key: "phone",   label: "Phone screen repair",     icon: "📱", needs: "device",    mins: 25,  pay: 140,  slaH: 3,  w: 5 },
    { key: "laptop",  label: "Laptop repair",           icon: "💻", needs: "device",    mins: 45,  pay: 220,  slaH: 6,  w: 4 },
    { key: "console", label: "Game console repair",     icon: "🎮", needs: "device",    mins: 40,  pay: 180,  slaH: 8,  w: 3 },
    { key: "drone",   label: "Drone repair",            icon: "🛸", needs: "device",    mins: 50,  pay: 260,  slaH: 8,  w: 2 },
    { key: "router",  label: "Router install",          icon: "📶", needs: "network",   mins: 60,  pay: 380,  slaH: 8,  w: 4 },
    { key: "cable",   label: "Office cable run",        icon: "🔌", needs: "network",   mins: 150, pay: 950,  slaH: 24, w: 2 },
    { key: "lane",    label: "Register lane down",      icon: "🧾", needs: "pos",       mins: 50,  pay: 420,  slaH: 4,  w: 4 },
    { key: "selfco",  label: "Self checkout fault",     icon: "🛒", needs: "pos",       mins: 90,  pay: 700,  slaH: 4,  w: 2 },
    { key: "camera",  label: "Camera install",          icon: "📷", needs: "camera",    mins: 105, pay: 1400, slaH: 24, w: 3 },
    { key: "camfix",  label: "Camera repair",           icon: "🔧", needs: "device",    mins: 40,  pay: 300,  slaH: 24, w: 0 },
    { key: "alpr",    label: "Plate reader service",    icon: "🔍", needs: "camera",    mins: 75,  pay: 2400, slaH: 24, w: 2 },
    { key: "confav",  label: "Conference room AV",      icon: "🎤", needs: "av",        mins: 150, pay: 1800, slaH: 24, w: 2 },
    { key: "dish",    label: "Satellite dish install",  icon: "📡", needs: "satellite", mins: 120, pay: 1100, slaH: 24, w: 3 }
  ]
};

// Storage. Swap these two functions for the database later; nothing else changes.
const KEY = "field-dispatch-v1";
const Store = {
  load() { try { const s = localStorage.getItem(KEY); return s ? JSON.parse(s) : null; } catch (e) { return null; } },
  save(s) { try { localStorage.setItem(KEY, JSON.stringify(s)); } catch (e) {} }
};

let S = Store.load() || {
  cash: CONFIG.startGrant, units: [], tickets: [], player: null, lastTick: Date.now(),
  jobsDone: 0, lastDividend: 0, nextId: 1, prev: null, moving: false, passenger: false, cams: {}
};
S.cams = S.cams || {};
S.scans = S.scans || {};
S.declined = S.declined || { count: 0, sites: {} };

// Live data. Real cameras from the Nevada roads feed and orbits for the satellite installers.
let CAMS = [], SATS = [];
fetch("/api/cameras").then(r => r.ok ? r.json() : []).then(d => { CAMS = Array.isArray(d) ? d : []; }).catch(() => {});
fetch("/api/sats").then(r => r.ok ? r.text() : "").then(t => {
  const L = t.split("\n").map(x => x.trim()).filter(Boolean);
  for (let i = 0; i + 2 < L.length + 1 && L[i + 2]; i += 3) {
    try { SATS.push({ name: L[i], rec: satellite.twoline2satrec(L[i + 1], L[i + 2]) }); } catch (e) {}
  }
}).catch(() => {});
const camById = id => CAMS.find(c => c.id === id);
// Plate readers. Known locations from public map data, any age. Contracts can be declined for good.
let ALPRS = [], alprTile = "";
function loadAlpr(p) {
  const t = Math.floor(p[0] / 0.5) + ":" + Math.floor(p[1] / 0.5);
  if (t === alprTile) return; alprTile = t;
  fetch("/api/alpr?lat=" + p[0] + "&lng=" + p[1]).then(r => r.ok ? r.json() : []).then(d => { ALPRS = Array.isArray(d) ? d : []; }).catch(() => { alprTile = ""; });
}
// Site scans. One scan per 500 meter cell, kept in the save so the server is never asked twice.
const cellOf = (lat, lng) => Math.floor(lat / 0.005) + ":" + Math.floor(lng / 0.005);
function scanSite(k) {
  const c = cellOf(k.lat, k.lng), have = S.scans[c];
  if (have && have.networks !== undefined) return;
  fetch("/api/scan?lat=" + k.lat + "&lng=" + k.lng).then(r => r.json()).then(d => { if (d && d.networks !== undefined) S.scans[c] = d; }).catch(() => {});
}
function scanText(k) {
  const d = k && S.scans[cellOf(k.lat, k.lng)];
  if (!d) return "";
  const open = (d.encryption.none || 0) + (d.encryption.wep || 0), top = d.busiestChannels[0];
  return "Site scan: " + d.networks + " networks nearby, " + open + " open or weak" + (top ? ", busiest channel " + top.channel : "") + ". ";
}
function satAt(sat, date, site) {
  const pv = satellite.propagate(sat.rec, date);
  if (!pv || !pv.position) return null;
  const g = satellite.gstime(date), ecf = satellite.eciToEcf(pv.position, g), geo = satellite.eciToGeodetic(pv.position, g);
  const look = site ? satellite.ecfToLookAngles({ latitude: site[0] * Math.PI / 180, longitude: site[1] * Math.PI / 180, height: 0.7 }, ecf) : null;
  return { lat: satellite.degreesLat(geo.latitude), lng: satellite.degreesLong(geo.longitude), elev: look ? look.elevation * 180 / Math.PI : 0 };
}
function nextPass(site, from) {
  if (!SATS.length) return null;
  for (let t = from; t < from + CONFIG.passSearchH * 3600000; t += 30000) {
    const d = new Date(t);
    for (const sat of SATS) { const a = satAt(sat, d, site); if (a && a.elev >= CONFIG.passMinElevDeg) return { t, name: sat.name }; }
  }
  return null;
}

const jobByKey = Object.fromEntries(THEME.jobs.map(j => [j.key, j]));
const money = n => "$" + Math.round(n).toLocaleString("en-US");
function dur(ms) {
  const s = Math.max(0, Math.round(ms / 1000)), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  return h ? h + "h " + m + "m" : m ? m + "m " + x + "s" : x + "s";
}
function meters(a, b) {
  const R = 6371000, r = Math.PI / 180, dLat = (b[0] - a[0]) * r, dLng = (b[1] - a[1]) * r;
  const q = Math.sin(dLat / 2) ** 2 + Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(q));
}
function travelMs(u, a, b) {
  const mps = THEME.units[u.type].kmh / 3.6;
  return meters(a, b) * CONFIG.roadFactor / mps * 1000 / CONFIG.timeScale;
}
function playerPt() { return S.player ? [S.player.lat, S.player.lng] : CONFIG.fallbackCenter; }
function unitPt(u, now) {
  if (u.state === "idle") return playerPt();
  if (u.state === "onsite") { const t = S.tickets.find(k => k.id === u.ticketId); return t ? [t.lat, t.lng] : playerPt(); }
  const L = u.leg, f = Math.min(1, Math.max(0, (now - L.start) / (L.end - L.start || 1)));
  if (L.path && L.cum) {
    const d = f * L.cum[L.cum.length - 1]; let i = 1;
    while (i < L.cum.length - 1 && L.cum[i] < d) i++;
    const a = L.path[i - 1], b = L.path[i], g = (d - L.cum[i - 1]) / ((L.cum[i] - L.cum[i - 1]) || 1);
    return [a[0] + (b[0] - a[0]) * g, a[1] + (b[1] - a[1]) * g];
  }
  return [L.from[0] + (L.to[0] - L.from[0]) * f, L.from[1] + (L.to[1] - L.from[1]) * f];
}
// Roads. Each leg starts as a straight line estimate, then snaps to the real road route once it arrives.
const ROUTES = {};
const routeKey = (a, b) => a[0].toFixed(4) + "," + a[1].toFixed(4) + ";" + b[0].toFixed(4) + "," + b[1].toFixed(4);
function getRoute(a, b) {
  const k = routeKey(a, b);
  if (!ROUTES[k]) ROUTES[k] = fetch("/api/route?from=" + a[0] + "," + a[1] + "&to=" + b[0] + "," + b[1])
    .then(r => r.ok ? r.json() : null).then(d => {
      if (!d || !d.path || d.path.length < 2) { delete ROUTES[k]; return null; }
      const cum = [0]; for (let i = 1; i < d.path.length; i++) cum.push(cum[i - 1] + meters(d.path[i - 1], d.path[i]));
      d.cum = cum; ROUTES[k].done = d; return d;
    }).catch(() => { delete ROUTES[k]; return null; });
  return ROUTES[k];
}
const routeNow = (a, b) => { const p = ROUTES[routeKey(a, b)]; return p && p.done; };
function startLeg(u, from, to, t) {
  const leg = { from, to, start: t, end: t + travelMs(u, from, to), path: null, cum: null };
  u.leg = leg;
  getRoute(from, to).then(r => { if (r && u.leg === leg) { leg.path = r.path; leg.cum = r.cum; leg.end = leg.start + r.dur * 1000 / CONFIG.timeScale; } });
}
function randomNear(c) {
  const km = CONFIG.spawnKm[0] + Math.random() * (CONFIG.spawnKm[1] - CONFIG.spawnKm[0]);
  const b = Math.random() * 2 * Math.PI, dLat = km / 111.32 * Math.cos(b);
  const dLng = km / (111.32 * Math.cos(c[0] * Math.PI / 180)) * Math.sin(b);
  return [c[0] + dLat, c[1] + dLng];
}

// Engine
function ownedTags() { const t = new Set(); S.units.forEach(u => THEME.units[u.type].tags.forEach(x => t.add(x))); return t; }
function spawn(now, dtH) {
  if (!S.units.length) return;
  const cap = CONFIG.baseTickets + CONFIG.ticketsPerUnit * S.units.length;
  if (S.tickets.filter(t => t.status === "open").length >= cap) return;
  const anyOpen = S.tickets.some(t => t.status === "open");
  if (anyOpen && Math.random() > Math.min(1, S.units.length * CONFIG.jobsPerUnitHour * dtH)) return;
  const tags = ownedTags();
  const freeCams = CAMS.filter(c => !S.cams[c.id] && !S.tickets.some(t => t.camId === c.id) && meters(playerPt(), [c.lat, c.lng]) <= CONFIG.camMaxKm * 1000);
  const freeAlpr = ALPRS.filter(a => !S.declined.sites[a.id] && !S.tickets.some(t => t.alprId === a.id) && meters(playerPt(), [a.lat, a.lng]) <= CONFIG.camMaxKm * 1000);
  const pool = THEME.jobs.filter(j => j.w > 0 && tags.has(j.needs) && (j.key !== "camera" || freeCams.length) && (j.key !== "alpr" || freeAlpr.length));
  if (!pool.length) return;
  let r = Math.random() * pool.reduce((a, j) => a + j.w, 0), job = pool[0];
  for (const j of pool) { r -= j.w; if (r <= 0) { job = j; break; } }
  const cam = job.key === "camera" ? freeCams[Math.floor(Math.random() * freeCams.length)] : null;
  const alpr = job.key === "alpr" ? freeAlpr[Math.floor(Math.random() * freeAlpr.length)] : null;
  const p = cam ? [cam.lat, cam.lng] : alpr ? [alpr.lat, alpr.lng] : randomNear(playerPt());
  S.tickets.push({ id: S.nextId++, key: job.key, lat: p[0], lng: p[1], created: now, camId: cam ? cam.id : null, alprId: alpr ? alpr.id : null,
    deadline: now + job.slaH * 3600000 / CONFIG.timeScale, status: "open" });
}
function breakdowns(now, dtH) {
  Object.entries(S.cams).forEach(([id, c]) => {
    if (c.broken || Math.random() > CONFIG.camBreakPerHour * dtH) return;
    const cam = camById(id); if (!cam) return;
    c.broken = true;
    S.tickets.push({ id: S.nextId++, key: "camfix", lat: cam.lat, lng: cam.lng, created: now, camId: id,
      deadline: now + jobByKey.camfix.slaH * 3600000 / CONFIG.timeScale, status: "open" });
    toast(cam.name + " camera went down.");
  });
}
function complete(u, t) {
  const k = S.tickets.find(x => x.id === u.ticketId), job = jobByKey[k.key];
  const late = t > k.deadline, pay = job.pay * (late ? CONFIG.latePay : 1);
  S.cash += pay; S.jobsDone++;
  toast(job.label + " done. " + money(pay) + (late ? " (late)" : ""));
  if (k.key === "camera" && k.camId) { S.cams[k.camId] = { installed: t, broken: false }; toast("Camera feed is live. " + money(pay)); }
  if (k.key === "camfix" && S.cams[k.camId]) S.cams[k.camId].broken = false;
  S.tickets = S.tickets.filter(x => x.id !== k.id);
  u.state = "returning"; u.ticketId = null;
  startLeg(u, [k.lat, k.lng], playerPt(), t);
}
function stepUnit(u, now) {
  for (let i = 0; i < 6; i++) {
    if (u.state === "enroute" && now >= u.leg.end) {
      const job = jobByKey[S.tickets.find(k => k.id === u.ticketId).key];
      const k = S.tickets.find(x => x.id === u.ticketId);
      u.state = "onsite"; u.workEnd = u.leg.end + job.mins * 60000 / CONFIG.timeScale; u.leg = null; u.pass = null;
      scanSite(k);
      if (job.key === "dish") { const ps = nextPass([k.lat, k.lng], u.workEnd); if (ps) { u.workEnd = ps.t; u.pass = ps.name; } }
      continue;
    }
    if (u.state === "onsite" && now >= u.workEnd) { complete(u, u.workEnd); continue; }
    if (u.state === "returning" && now >= u.leg.end) {
      if (meters(u.leg.to, playerPt()) <= CONFIG.returnRadiusM) {
        u.state = "idle"; u.leg = null; toast(THEME.units[u.type].label + " is back with you."); break;
      }
      startLeg(u, u.leg.to, playerPt(), u.leg.end); continue;
    }
    break;
  }
}
function tick() {
  const now = Date.now(), dtMs = Math.max(0, now - S.lastTick), dtH = dtMs * CONFIG.timeScale / 3600000;
  S.cash -= S.units.reduce((a, u) => a + THEME.units[u.type].wage, 0) * dtH;
  S.units.forEach(u => stepUnit(u, now));
  S.tickets = S.tickets.filter(t => t.status !== "open" || t.key === "camfix" || now < t.deadline);
  breakdowns(now, dtH);
  spawn(now, dtH);
  const D = CONFIG.dividend;
  if (S.units.length < D.belowUnits && S.cash < D.belowCash && S.jobsDone >= D.minJobs &&
      now - S.lastDividend > D.cooldownH * 3600000) {
    S.cash += D.amount; S.lastDividend = now; toast("County dividend paid: " + money(D.amount));
  }
  S.lastTick = now; Store.save(S); draw(now);
}

// Motion. Feels still, walking or driving from the phone's own sensors, with no location involved.
const MO = { buf: [], gx: 0, gy: 0, gz: 0, gInit: false, mode: "idle", pending: "idle", n: 0, live: false, floor: 0.006 };
function onMotion(e) {
  const t = performance.now(), a = e.acceleration; let lx, ly, lz;
  if (a && a.x !== null && a.y !== null && a.z !== null) { lx = a.x; ly = a.y; lz = a.z; }
  else {
    const g = e.accelerationIncludingGravity; if (!g || g.x === null) return;
    if (!MO.gInit) { MO.gx = g.x; MO.gy = g.y; MO.gz = g.z; MO.gInit = true; }
    MO.gx = 0.94 * MO.gx + 0.06 * g.x; MO.gy = 0.94 * MO.gy + 0.06 * g.y; MO.gz = 0.94 * MO.gz + 0.06 * g.z;
    lx = g.x - MO.gx; ly = g.y - MO.gy; lz = g.z - MO.gz;
  }
  MO.live = true;
  MO.buf.push({ t, m: Math.sqrt(lx * lx + ly * ly + lz * lz) / 9.81 });
  while (MO.buf.length && t - MO.buf[0].t > 4000) MO.buf.shift();
}
function classifyMotion() {
  const b = MO.buf, n = b.length; if (n < 40) return;
  const rate = n / ((b[n - 1].t - b[0].t) / 1000);
  let mean = 0; for (const x of b) mean += x.m; mean /= n;
  let v = 0; for (const x of b) v += (x.m - mean) ** 2; const std = Math.sqrt(v / n);
  let jerk = 0; for (let i = 1; i < n; i++) jerk += Math.abs(b[i].m - b[i - 1].m); const buzz = jerk / (n - 1);
  let best = 0, bestLag = 0; const minLag = Math.round(rate * 0.28), maxLag = Math.round(rate * 0.85);
  if (v > 0) for (let lag = minLag; lag <= maxLag && lag < n - 10; lag++) {
    let c = 0; for (let i = 0; i + lag < n; i++) c += (b[i].m - mean) * (b[i + lag].m - mean);
    c = c / ((n - lag) * (v / n)); if (c > best) { best = c; bestLag = lag; }
  }
  const cad = bestLag ? rate / bestLag : 0, f = MO.floor * 1.6;
  const guess = std < f && buzz < f ? "idle" : best > 0.35 && std > 0.05 && cad >= 1.2 && cad <= 3.6 ? "walking" : best <= 0.35 ? "driving" : "walking";
  if (guess === MO.pending) MO.n++; else { MO.pending = guess; MO.n = 1; }
  if (MO.n >= 3) MO.mode = MO.pending;
}
window.addEventListener("devicemotion", onMotion, true);
document.addEventListener("click", function askMotion() {
  document.removeEventListener("click", askMotion);
  if (typeof DeviceMotionEvent !== "undefined" && typeof DeviceMotionEvent.requestPermission === "function") DeviceMotionEvent.requestPermission().catch(() => {});
});

// Movement badge. Motion sensors react in seconds; location confirms driving after holding the speed long enough.
let FIXES = [], moveState = "still";
function speedOver(sec) {
  if (FIXES.length < 2) return null;
  const last = FIXES[FIXES.length - 1];
  if (Date.now() - last.t > 60000) return null;
  for (let i = FIXES.length - 2; i >= 0; i--) {
    const dt = (last.t - FIXES[i].t) / 1000;
    if (dt >= sec) return meters([FIXES[i].lat, FIXES[i].lng], [last.lat, last.lng]) / dt;
  }
  return null;
}
function updateMove() {
  const sp = speedOver(CONFIG.driveConfirmS), fast = sp !== null && sp >= CONFIG.driveMph * 0.44704;
  const m = MO.live ? MO.mode : null;
  if (fast && m !== "idle" && m !== "walking") moveState = "driving";
  else if (m === "driving") moveState = "maybe";
  else if (m === "walking" || (!MO.live && sp !== null && sp > 0.6)) moveState = "walking";
  else moveState = "still";
  S.moving = moveState === "driving";
  if (!S.moving) S.passenger = false;
}
setInterval(() => { classifyMotion(); updateMove(); }, 500);

// Location. Uses the fix the phone already has when it is fresh enough.
function onFix(p) {
  const now = Date.now(), pt = { lat: p.coords.latitude, lng: p.coords.longitude, t: p.timestamp };
  if (!FIXES.length || pt.t > FIXES[FIXES.length - 1].t) FIXES.push(pt);
  FIXES = FIXES.filter(f => now - f.t < 360000);
  const first = !S.player; S.prev = pt; S.player = pt;
  S.units.filter(u => u.state === "returning" && meters(u.leg.to, playerPt()) > 300).forEach(u => startLeg(u, unitPt(u, now), playerPt(), now));
  if (first) map.setView(playerPt(), 13);
  loadAlpr(playerPt());
  locStatus = "Location " + dur(now - pt.t) + " old";
}
let locStatus = "Finding location";
function locate() {
  if (!navigator.geolocation) { locStatus = "No location, using default"; return; }
  navigator.geolocation.getCurrentPosition(onFix, () => { locStatus = "Location off, using default"; },
    { enableHighAccuracy: false, maximumAge: CONFIG.fixMaxAgeMs, timeout: 10000 });
}

// Actions
function buy(type) {
  const T = THEME.units[type]; if (S.cash < T.price) return toast("Not enough cash for " + T.label + ".");
  S.cash -= T.price; S.units.push({ id: S.nextId++, type, state: "idle" }); toast(T.label + " hired."); tick();
}
function dispatch(unitId, ticketId) {
  if (S.moving && !S.passenger) return;
  const u = S.units.find(x => x.id === unitId), k = S.tickets.find(x => x.id === ticketId);
  if (!u || !k || u.state !== "idle" || k.status !== "open") return;
  u.state = "enroute"; u.ticketId = k.id; k.status = "assigned";
  startLeg(u, playerPt(), [k.lat, k.lng], Date.now()); sel = null; tick();
}

// Drawing
const map = L.map("map", { zoomControl: false }).setView(CONFIG.fallbackCenter, 12);
L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "© OpenStreetMap" }).addTo(map);
const me = L.marker(CONFIG.fallbackCenter, { icon: L.divIcon({ className: "", html: '<div class="me"></div>', iconSize: [22, 22] }) }).addTo(map);
const marks = {}, lines = {};
function pin(id, pt, icon, dim) {
  if (!marks[id]) {
    marks[id] = L.marker(pt, { icon: L.divIcon({ className: "", html: '<div class="pin' + (dim ? " dim" : "") + '">' + icon + "</div>", iconSize: [24, 24] }) }).addTo(map);
    if (id[0] === "t") marks[id].on("click", () => { sel = +id.slice(1); tab = "tickets"; draw(Date.now()); });
  } else marks[id].setLatLng(pt);
}
let tab = "tickets", sel = null;
function draw(now) {
  document.getElementById("cash").textContent = money(S.cash);
  document.getElementById("status").textContent = S.units.length + " crew, " + S.tickets.length + " tickets. " + locStatus;
  const MV = { still: ["🧍", "Still", "b-still"], walking: ["🚶", "Walking", "b-walk"], maybe: ["🚗", "Driving?", "b-maybe"], driving: ["🚗", "Driving", "b-drive"] }[moveState];
  const mb = document.getElementById("move"); mb.textContent = MV[0] + " " + MV[1]; mb.className = "badge " + MV[2];
  document.getElementById("lock").style.display = S.moving && !S.passenger ? "block" : "none";
  me.setLatLng(playerPt());
  const live = new Set();
  S.tickets.forEach(t => { const id = "t" + t.id; live.add(id); pin(id, [t.lat, t.lng], jobByKey[t.key].icon); });
  S.units.filter(u => u.state !== "idle").forEach(u => { const id = "u" + u.id; live.add(id); pin(id, unitPt(u, now), THEME.units[u.type].icon); });
  CAMS.forEach(c => {
    const st = S.cams[c.id]; if (!st && meters(playerPt(), [c.lat, c.lng]) > CONFIG.camMaxKm * 1000) return;
    if (S.tickets.some(t => t.camId === c.id)) return;
    const id = "c" + c.id; live.add(id); pin(id, [c.lat, c.lng], st ? "🎥" : "📷", !st);
  });
  S.units.filter(u => u.state === "onsite" && u.pass).forEach(u => {
    const sat = SATS.find(x => x.name === u.pass); const a = sat && satAt(sat, new Date(now));
    if (a) { const id = "s" + u.id; live.add(id); pin(id, [a.lat, a.lng], "🛰️"); }
  });
  Object.keys(marks).forEach(id => { if (!live.has(id)) { map.removeLayer(marks[id]); delete marks[id]; } });
  const liveLines = new Set();
  S.units.filter(u => u.leg && u.leg.path).forEach(u => {
    const id = "l" + u.id; liveLines.add(id);
    if (!lines[id] || lines[id].src !== u.leg.path) {
      if (lines[id]) map.removeLayer(lines[id]);
      lines[id] = L.polyline(u.leg.path, { color: u.state === "returning" ? "#5B6B7A" : "#1F6FEB", weight: 4, opacity: 0.55, dashArray: u.state === "returning" ? "6 6" : null }).addTo(map);
      lines[id].src = u.leg.path;
    }
  });
  Object.keys(lines).forEach(id => { if (!liveLines.has(id)) { map.removeLayer(lines[id]); delete lines[id]; } });
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  const P = document.getElementById("pane"), top = P.scrollTop;
  if (tab === "cams") { drawCams(P); return; }
  P.innerHTML = tab === "tickets" ? ticketsHtml(now) : tab === "crew" ? crewHtml(now) : shopHtml();
  P.scrollTop = top;
}
function ticketsHtml(now) {
  if (!S.units.length) return '<div class="empty">Hire your first crew in the Shop to start getting tickets.</div>';
  if (!S.tickets.length) return '<div class="empty">No tickets yet. New ones arrive as your crew grows.</div>';
  const locked = S.moving && !S.passenger;
  return S.tickets.slice().sort((a, b) => a.deadline - b.deadline).map(t => {
    const j = jobByKey[t.key], left = t.deadline - now, km = (meters(playerPt(), [t.lat, t.lng]) * CONFIG.roadFactor / 1000).toFixed(1);
    let h = '<div class="row" data-act="select" data-id="' + t.id + '"><h3>' + j.icon + " " + j.label + "</h3>" +
      '<div class="meta">' + (left < 3600000 / CONFIG.timeScale ? '<span class="tag t-late">SLA</span>' : "") +
      "Pays " + money(j.pay) + ". " + km + " km away. SLA in " + dur(left) + ". " + (t.status === "assigned" ? "Crew assigned." : "") + "</div>";
    if (sel === t.id && t.status === "open") {
      const ok = S.units.filter(u => u.state === "idle" && THEME.units[u.type].tags.includes(j.needs));
      h += ok.length ? ok.map(u => '<button class="btn main" data-act="send" data-u="' + u.id + '" data-t="' + t.id + '"' + (locked ? " disabled" : "") +
        ">Send " + THEME.units[u.type].label + ", " + etaText(u, playerPt(), [t.lat, t.lng]) + "</button>").join("")
        : '<div class="meta">No crew with you can take this job.</div>';
      if (t.key === "alpr") h += '<button class="btn" data-act="decline" data-t="' + t.id + '">Decline contract</button>';
    }
    return h + "</div>";
  }).join("");
}
function etaText(u, a, b) {
  const r = routeNow(a, b);
  return r ? dur(r.dur * 1000 / CONFIG.timeScale) + " by road" : "about " + dur(travelMs(u, a, b));
}
function crewHtml(now) {
  if (!S.units.length) return '<div class="empty">No crew yet. Hire one in the Shop.</div>';
  const words = { idle: "With you", enroute: "Driving to job", onsite: "Working", returning: "Coming back" };
  return S.units.map(u => {
    const T = THEME.units[u.type];
    const left = u.state === "onsite" ? (u.pass ? "Waiting for " + u.pass + " to pass overhead, done in " : "Done in ") + dur(u.workEnd - now) : u.leg ? "Arrives in " + dur(u.leg.end - now) : "";
    return '<div class="row"><h3>' + T.icon + " " + T.label + '</h3><div class="meta"><span class="tag t-' + u.state + '">' +
      words[u.state] + "</span>" + (left ? left + ". " : "") + (u.state === "onsite" ? scanText(S.tickets.find(x => x.id === u.ticketId)) : "") + "Wage " + money(T.wage) + " an hour.</div></div>";
  }).join("");
}
let watching = null, camsKey = "";
function drawCams(P) {
  const mine = Object.keys(S.cams).map(id => ({ id, cam: camById(id), st: S.cams[id] })).filter(x => x.cam);
  const key = watching + "|" + mine.map(x => x.id + (x.st.broken ? "b" : "")).join(",");
  if (key === camsKey) return;
  camsKey = key;
  if (!mine.length) { P.innerHTML = '<div class="empty">No cameras installed yet. Hire an AV crew and take a Camera install ticket.</div>'; return; }
  P.innerHTML = mine.map(x => '<div class="row"><h3>' + (x.st.broken ? "🔧 " : "🎥 ") + x.cam.name + "</h3>" +
    '<div class="meta">' + (x.st.broken ? '<span class="tag t-late">Down</span>Repair ticket open.' : '<span class="tag t-onsite">Live</span>') + "</div>" +
    (!x.st.broken ? '<button class="btn" data-act="watch" data-c="' + x.id + '">' + (watching === x.id ? "Stop feed" : "Watch feed") + "</button>" : "") +
    (watching === x.id && !x.st.broken ? '<video id="feed" muted playsinline autoplay controls></video>' : "") + "</div>").join("");
  const v = document.getElementById("feed");
  if (v) {
    const src = camById(watching).video;
    if (v.canPlayType("application/vnd.apple.mpegurl")) v.src = src;
    else if (window.Hls && Hls.isSupported()) { const h = new Hls(); h.loadSource(src); h.attachMedia(v); }
    else v.src = src;
  }
}
function shopHtml() {
  return '<div class="row">' + (S.declined.count ? '<div class="meta">Plate reader contracts declined: ' + S.declined.count + "</div>" : "") +
    '<button class="btn" data-act="restart">Restart game</button></div>' + Object.entries(THEME.units).map(([k, T]) => '<div class="row"><h3>' + T.icon + " " + T.label + "</h3>" +
    '<div class="meta">' + money(T.price) + " to hire. Wage " + money(T.wage) + " an hour.</div>" +
    '<button class="btn" data-act="buy" data-k="' + k + '"' + (S.cash < T.price ? " disabled" : "") + ">Hire</button></div>").join("");
}
let tt;
function toast(m) { const e = document.getElementById("toast"); e.textContent = m; e.style.display = "block"; clearTimeout(tt); tt = setTimeout(() => e.style.display = "none", 3500); }

document.querySelector("nav").addEventListener("click", e => { const b = e.target.closest("button"); if (b) { tab = b.dataset.tab; camsKey = ""; draw(Date.now()); } });
document.body.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const a = b.dataset.act;
  if (a === "buy") buy(b.dataset.k);
  else if (a === "send") { e.stopPropagation(); dispatch(+b.dataset.u, +b.dataset.t); }
  else if (a === "passenger") { S.passenger = true; tick(); }
  else if (a === "decline") {
    e.stopPropagation();
    const t = S.tickets.find(x => x.id === +b.dataset.t);
    if (t) { S.declined.count++; S.declined.sites[t.alprId] = 1; S.tickets = S.tickets.filter(x => x.id !== t.id); sel = null; toast("Contract declined. That site will not be offered again."); tick(); }
  }
  else if (a === "watch") { watching = watching === b.dataset.c ? null : b.dataset.c; camsKey = ""; draw(Date.now()); }
  else if (a === "restart") { if (confirm("Wipe this game and start over with the grant?")) { try { localStorage.removeItem(KEY); } catch (e) {} location.reload(); } }
  else if (a === "select") { const id = +b.dataset.id; sel = sel === id ? null : id; const t = S.tickets.find(x => x.id === id); if (t) { map.panTo([t.lat, t.lng]); getRoute(playerPt(), [t.lat, t.lng]).then(() => draw(Date.now())); } draw(Date.now()); }
});

if (S.player) map.setView(playerPt(), 13);
loadAlpr(playerPt());
S.units.forEach(u => {
  const leg = u.leg; if (!leg || leg.path) return;
  getRoute(leg.from, leg.to).then(r => { if (r && u.leg === leg) { leg.path = r.path; leg.cum = r.cum; leg.end = leg.start + r.dur * 1000 / CONFIG.timeScale; } });
});
locate(); setInterval(locate, CONFIG.locationEveryMs);
document.addEventListener("visibilitychange", () => { if (!document.hidden) { locate(); tick(); } });
tick(); setInterval(tick, 1000);
</script>
